<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>critrev CriticMarkup demo</title>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <main class="app">
      <header class="app-header">
        <div>
          <p class="eyebrow">critrev</p>
          <h1>CriticMarkup Pipeline</h1>
        </div>
        <div class="status-pill" id="status-pill">Ready</div>
      </header>

      <section class="stage-grid" aria-label="Pipeline stages">
        <article class="panel input-panel">
          <div class="panel-heading">
            <div>
              <p class="stage-label">Stage 1</p>
              <h2>Before / After</h2>
            </div>
            <button id="reset-sample" type="button">Reset</button>
          </div>
          <label class="field">
            <span>before.md</span>
            <textarea id="before-input" data-testid="before-input" spellcheck="false"></textarea>
          </label>
          <label class="field">
            <span>after.md</span>
            <textarea id="after-input" data-testid="after-input" spellcheck="false"></textarea>
          </label>
        </article>

        <article class="panel editor-input-panel">
          <div class="panel-heading">
            <div>
              <p class="stage-label">Stage 2.1</p>
              <h2>Raw Editor Input</h2>
            </div>
            <div class="button-row">
              <button id="sync-review" type="button">Sync</button>
              <button id="load-editor" type="button">Load</button>
            </div>
          </div>
          <label class="field">
            <span>review-input.critic.md</span>
            <textarea id="critic-input" data-testid="critic-input" spellcheck="false"></textarea>
          </label>
        </article>

        <article class="panel editor-panel">
          <div class="panel-heading">
            <div>
              <p class="stage-label">Stage 2.2</p>
              <h2>Review Editor</h2>
            </div>
          </div>
          <div class="editor-shell">
            <div class="editor-surface">
              <div class="editor-toolbar">
                <div class="format-toolbar" aria-label="Formatting">
                  <button
                    type="button"
                    class="format-button"
                    data-testid="format-heading-1"
                    data-format-action="line"
                    data-format-prefix="# "
                    data-format-suffix=""
                    data-rich-block="h1"
                    aria-label="Heading 1">
                    H1
                  </button>
                  <button
                    type="button"
                    class="format-button"
                    data-testid="format-heading-2"
                    data-format-action="line"
                    data-format-prefix="## "
                    data-format-suffix=""
                    data-rich-block="h2"
                    aria-label="Heading 2">
                    H2
                  </button>
                  <button
                    type="button"
                    class="format-button"
                    data-testid="format-heading-3"
                    data-format-action="line"
                    data-format-prefix="### "
                    data-format-suffix=""
                    data-rich-block="h3"
                    aria-label="Heading 3">
                    H3
                  </button>
                  <button
                    type="button"
                    class="format-button"
                    data-testid="format-bold"
                    data-format-action="inline"
                    data-format-prefix="**"
                    data-format-suffix="**"
                    data-rich-format="bold"
                    aria-label="Bold">
                    B
                  </button>
                  <button
                    type="button"
                    class="format-button italic"
                    data-testid="format-italic"
                    data-format-action="inline"
                    data-format-prefix="*"
                    data-format-suffix="*"
                    data-rich-format="italic"
                    aria-label="Italic">
                    I
                  </button>
                  <button
                    type="button"
                    class="format-button strike"
                    data-testid="format-strike"
                    data-format-action="inline"
                    data-format-prefix="~~"
                    data-format-suffix="~~"
                    data-rich-format="strikethrough"
                    aria-label="Strikethrough">
                    S
                  </button>
                  <button
                    type="button"
                    class="format-button code"
                    data-testid="format-code"
                    data-format-action="inline"
                    data-format-prefix="`"
                    data-format-suffix="`"
                    data-rich-format="code"
                    aria-label="Code">
                    &lt;/&gt;
                  </button>
                  <button
                    type="button"
                    class="format-button"
                    data-testid="format-link"
                    data-format-action="inline"
                    data-format-prefix="["
                    data-format-suffix="](https://example.com)"
                    data-format-placeholder="link"
                    aria-label="Link">
                    Link
                  </button>
                  <button
                    type="button"
                    class="format-button"
                    data-testid="format-image"
                    data-format-action="inline"
                    data-format-prefix="!["
                    data-format-suffix="](https://example.com/image.png)"
                    data-format-placeholder="alt"
                    aria-label="Image">
                    Img
                  </button>
                  <button
                    type="button"
                    class="format-button"
                    data-testid="format-quote"
                    data-format-action="line"
                    data-format-prefix="> "
                    data-format-suffix=""
                    data-rich-block="quote"
                    aria-label="Block quote">
                    Q
                  </button>
                  <button
                    type="button"
                    class="format-button"
                    data-testid="format-list"
                    data-format-action="line"
                    data-format-prefix="- "
                    data-format-suffix=""
                    data-rich-block="ul"
                    aria-label="Bulleted list">
                    UL
                  </button>
                  <button
                    type="button"
                    class="format-button"
                    data-testid="format-ordered-list"
                    data-format-action="line"
                    data-format-prefix="{n}. "
                    data-format-suffix=""
                    data-rich-block="ol"
                    aria-label="Numbered list">
                    1.
                  </button>
                  <button
                    type="button"
                    class="format-button"
                    data-testid="format-task-list"
                    data-format-action="line"
                    data-format-prefix="- [ ] "
                    data-format-suffix=""
                    data-rich-block="check"
                    aria-label="Task list">
                    [ ]
                  </button>
                  <button
                    type="button"
                    class="format-button code"
                    data-testid="format-code-block"
                    data-format-action="block"
                    data-format-prefix="```\n"
                    data-format-suffix="\n```"
                    data-format-placeholder="code"
                    data-rich-block="code"
                    aria-label="Code block">
                    ```
                  </button>
                  <button
                    type="button"
                    class="format-button"
                    data-testid="format-rule"
                    data-format-action="block"
                    data-format-prefix="\n---\n"
                    data-format-suffix=""
                    data-rich-block="hr"
                    aria-label="Horizontal rule">
                    HR
                  </button>
                </div>
                <div class="content-mode-toggle" aria-label="Editor content mode">
                  <button type="button" class="active" data-content-mode="wysiwyg">WYSIWYG</button>
                  <button type="button" data-content-mode="source">Text</button>
                </div>
                <div class="toolbar-menu">
                  <button
                    type="button"
                    class="icon-button"
                    id="view-mode-toggle"
                    data-testid="view-mode-toggle"
                    aria-label="Review display mode"
                    aria-expanded="false"
                    aria-controls="view-mode-menu">
                    <svg aria-hidden="true" viewBox="0 0 24 24">
                      <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6Z"></path>
                      <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                  </button>
                  <div class="toolbar-popover mode-menu" id="view-mode-menu" data-testid="view-mode-menu" hidden>
                    <button type="button" class="active" data-view-mode="revisions">Show revisions</button>
                    <button type="button" data-view-mode="reject">Preview reject all</button>
                    <button type="button" data-view-mode="accept">Preview accept all</button>
                    <label class="menu-toggle" for="comments-toggle">
                      <input id="comments-toggle" data-testid="comments-toggle" type="checkbox" checked />
                      <span>Show comments</span>
                    </label>
                  </div>
                </div>
                <div class="toolbar-menu">
                  <button
                    type="button"
                    class="icon-button"
                    id="info-toggle"
                    data-testid="info-toggle"
                    aria-label="Review summary"
                    aria-expanded="false"
                    aria-controls="info-popover">
                    i
                  </button>
                  <div class="toolbar-popover info-popover" id="info-popover" data-testid="info-popover" hidden>
                    <div class="metrics" id="metrics" aria-label="CriticMarkup counts"></div>
                  </div>
                </div>
              </div>
              <div
                class="rendered-review"
                id="rendered-review"
                data-testid="rendered-review"
                contenteditable="true"
                spellcheck="true"
                role="textbox"
                aria-label="Rendered review text"></div>
              <div
                class="inline-review-actions"
                id="inline-review-actions"
                data-testid="inline-review-actions"
                hidden>
                <button type="button" data-inline-decision="accept" aria-label="Accept suggestion">✓</button>
                <button type="button" data-inline-decision="reject" aria-label="Reject suggestion">×</button>
              </div>
              <form class="comment-popover" id="comment-popover" data-testid="comment-popover" hidden>
                <label class="comment-field">
                  <span>Comment</span>
                  <input id="comment-input" data-testid="comment-input" autocomplete="off" />
                </label>
                <button type="submit">Add comment</button>
              </form>
              <div class="comment-display" id="comment-display" data-testid="comment-display" hidden>
                <div class="comment-display-text" id="comment-display-text" data-testid="comment-display-text"></div>
                <button
                  type="button"
                  class="comment-delete-button"
                  id="comment-delete"
                  data-testid="delete-comment">
                  Delete
                </button>
              </div>
            </div>
            <aside class="suggestion-pane" aria-label="Changes">
              <h3>Changes</h3>
              <div class="change-list" id="change-list" aria-label="Review changes"></div>
            </aside>
          </div>
        </article>

        <article class="panel editor-output-panel">
          <div class="panel-heading">
            <div>
              <p class="stage-label">Stage 2.3</p>
              <h2>Raw Editor Output</h2>
            </div>
          </div>
          <label class="field">
            <span>review-output.critic.md</span>
            <textarea id="critic-output" data-testid="critic-output" readonly spellcheck="false"></textarea>
          </label>
        </article>

        <article class="panel output-panel">
          <div class="panel-heading">
            <div>
              <p class="stage-label">Stage 3</p>
              <h2>Finalizer</h2>
            </div>
          </div>
          <label class="field">
            <span>final.md</span>
            <textarea id="final-output" data-testid="final-output" readonly spellcheck="false"></textarea>
          </label>
          <label class="field">
            <span>final-clean.md</span>
            <textarea id="clean-output" data-testid="clean-output" readonly spellcheck="false"></textarea>
          </label>
        </article>
      </section>
    </main>
  </body>
</html>
